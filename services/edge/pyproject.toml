[project]
name = "foodsafe-edge"
version = "0.1.0"
description = "Local camera, rules, evidence, and sync agent for the single-camera food-safety pilot."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "lap==0.5.12",
  "livekit==1.1.13",
  "livekit-api==1.2.0",
  "numpy==2.2.6",
  "opencv-contrib-python==4.12.0.88",
  "opencv-python==4.12.0.88",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.2.3",
  "ultralytics==8.3.191",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
sensors = [
  "paho-mqtt==2.1.0",
  "pyserial==3.5",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foodsafe_edge"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
